groups:
  - name: storage
    rules:
      - record: node:root_filesystem_used_percent
        expr: >-
          100 * (1 -
          node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}
          /
          node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"})

      - alert: RootFilesystemWarning
        expr: node:root_filesystem_used_percent >= 70 and node:root_filesystem_used_percent < 80
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Root filesystem usage is above 70%
          description: Root filesystem usage has been {{ $value | printf "%.1f" }}% for 30 minutes.

      - alert: RootFilesystemCritical
        expr: node:root_filesystem_used_percent >= 80 and node:root_filesystem_used_percent < 90
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Root filesystem usage is above 80%
          description: Root filesystem usage has been {{ $value | printf "%.1f" }}% for 15 minutes.

      - alert: RootFilesystemEmergency
        expr: node:root_filesystem_used_percent >= 90
        for: 5m
        labels:
          severity: emergency
        annotations:
          summary: Root filesystem usage is above 90%
          description: Root filesystem usage has been {{ $value | printf "%.1f" }}% for 5 minutes.

      - alert: RootFilesystemLowSpace
        expr: node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"} < 20 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Root filesystem has less than 20 GiB available
          description: Root filesystem has {{ $value | humanize1024 }}B available.
